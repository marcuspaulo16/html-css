<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1></h1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Output</legend>
            <p>
                <label for="in1">Número 1: </label>
                <input type="number" name="numero1" id="in1" min="0" max="50" required
                oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            </p>
            <p>
                <label for="in2">Número 2: </label>
                <input type="number" name="numero1" id="in2" min="0" max="50" required
                oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
            </p>
            <p>
                <label for="isoma">Resultado: </label>
                <output name="soma" id="isoma">0</output>
                <!-- Output serve para visualização local, não será enviado -->
            </p>
        </fieldset>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
        
    </form>

</body>
</html>
