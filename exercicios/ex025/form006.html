<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimos Inputs</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post">
        <fieldset>
            <legend>Informações</legend>
            <p>
                <label for="icolor">Cor Favorita: </label>
                <input type="color" name="color" id="icolor">
            </p>
            <p>
                <label for="irange">Medidor: </label>
                <input type="range" name="range" id="irange" min="1" max="10">
            </p>
            <p>
                <label for="ifile">Arquivo: </label>
                <input type="file" name="file" id="ifile">
                <!-- Tem que ser metodo POST se tiver isso no formulário -->
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
