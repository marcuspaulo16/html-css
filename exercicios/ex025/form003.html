<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário</title>
</head>
<body>
    <h1>Testando Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="off">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" maxlength="30" minlength="10" required placeholder="Nome Completo Aqui!">
        </p>
        <p>
            <label for="iidade">Idade:</label>
            <input type="number" name="idade" id="iidade" min="1" max="99" required placeholder="Idade Aqui!">
        </p>
        <p>
            <label for="idata">Data:</label>
            <input type="date" name="data" id="idata">
            <!-- Posso colocar value="" e tornar a data, o mes ou o ano padrão, mas não preciso fazer isso manualmente posso fazer isso usando js -->
        </p>
        <p>
            <label for="imes">Mês:</label>
            <input type="month" name="mes" id="imes">
            <!-- Posso colocar value="" aqui também, mas é desnecessario tendo o js -->
        </p>
        <p>
            <label for=" ihora">Horario:</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <input type="submit" name="enviar" id="ienviar">
            <input type="reset" name="limpar" id="ilimpar">
        </p>
    </form>
</body>
</html>
