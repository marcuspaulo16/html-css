<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox e Radio</title>
</head>
<body>
    <fieldset>
        <legend>Esportes Favoritos</legend>
        <form action="cadastro.php" method="post">
            <input type="checkbox" name="fut" id="ifut"> <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="bas" id="ibas"> <label for="ibas">Basquete</label> <br>
            <input type="checkbox" name="ten" id="iten"> <label for="iten">Tenis</label> <br>
            <input type="checkbox" name="vol" id="ivol"> <label for="ivol">Volei</label> <br>
        </form>
    </fieldset>
    <fieldset>
        <legend>Sexo</legend>
        <form action="cadastro.php" method="post">
            <input type="radio" name="sex" id="ifem"> <label for="ifem">Feminino</label>
            <input type="radio" name="sex" id="imas"> <label for="imas">Masculino</label>
            <!-- O type="radio" tem que ter o mesmo nome para a seleção ser unica, mas o id diferente -->
        </form>
    </fieldset>
</body>
</html>
