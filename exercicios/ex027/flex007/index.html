<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: blue;

            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: tomato;
            color: white;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
        
        #i1 {
            order: 2;
        }

        #i2 {
            order: -5;
        }

        #i3 {
            order: 1;
        }

        #i4 {
            order: -1;
        }
        
        #i5 {
            order: 0;
        }

        #i6 {
            order: 5;
        }

        #i7 {
            order: 0;
        }

        #i8 {
            order: 2;
        }

        
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>    
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
        <div class="item" id="i8">H</div>
    </div>
</body>
</html>
