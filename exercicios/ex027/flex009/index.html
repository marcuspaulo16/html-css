<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.container {
            background-color: blue;
            display: flex;
            flex-flow: row wrap;

        }

        div.item {
            background-color: tomato;
            color: white;
            border: 1px solid black;
            text-align: center;
            flex-basis: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Um Texto Aqui</div>
        <div class="item">B</div>
        <div class="item">Um Texto Maior Aqui</div>
        <div class="item">Um Texto Gigantesco Bem Aqui</div>
        <div class="item">E</div>    
        <div class="item">F</div>
        <div class="item">Um Texto Aqui</div>
        <div class="item">H</div>
    </div>
</body>
</html>
